services:
  app:
    build:
      context: .
      dockerfile: app.dockerfile
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
